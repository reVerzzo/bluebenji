<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benji's Lab - Tienda de Ropa Urbana</title>

    <!-- Tailwind (Play CDN) + configuración de marca -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tw-config.js"></script>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-bg text-brand-text font-sans">

    <!-- ===== NAVBAR (compartido) ===== -->
    <header class="sticky top-0 z-40 bg-brand-bg/95 backdrop-blur border-b border-white/5">
        <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="index.html" class="font-brand text-2xl tracking-wide shrink-0">BENJI'S LAB</a>

            <!-- Enlaces (se colapsan en móvil) -->
            <div id="navMenu" class="hidden md:flex md:items-center gap-6 absolute md:static top-full left-0 right-0 bg-brand-bg md:bg-transparent border-b border-white/10 md:border-0 px-4 md:px-0 py-3 md:py-0 flex-col md:flex-row">
                <a href="index.html" class="font-bold text-sm hover:text-brand-green">INICIO</a>
                <a href="tienda.html" class="font-bold text-sm hover:text-brand-green">TIENDA</a>
                <a href="index.html#drops" class="font-bold text-sm hover:text-brand-green">NUEVOS DROPS</a>
            </div>

            <!-- Iconos siempre visibles -->
            <div class="flex items-center gap-4 shrink-0">
                <a href="tienda.html" class="hover:opacity-80" aria-label="Buscar"><i class="fas fa-search text-brand-green"></i></a>
                <button data-cart-open class="relative hover:opacity-80" aria-label="Carrito">
                    <i class="fas fa-shopping-cart text-lg"></i>
                    <span id="cartCount" class="hidden absolute -top-2 -right-2 bg-brand-noti text-white text-[10px] font-bold rounded-full px-1.5 py-0.5">0</span>
                </button>
                <button id="navToggle" class="md:hidden text-xl" aria-label="Menú"><i class="fas fa-bars"></i></button>
            </div>
        </nav>
    </header>

    <!-- ===== HERO (imagen de fondo) ===== -->
    <section id="inicio" class="relative min-h-[88vh] md:min-h-[116vw] flex items-center justify-center text-center">
        <div class="absolute inset-0 bg-cover md:bg-contain bg-top bg-no-repeat" style="background-image:url('images/inicio.jpg')"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/50 to-brand-bg"></div>
        <div class="relative z-10 px-5 max-w-3xl">
            <span class="inline-block bg-brand-green text-brand-bg font-bold text-xs tracking-widest uppercase px-4 py-1.5 rounded-full mb-5">Nueva colección · Aerógrafo Urbano</span>
            <h1 class="font-brand uppercase tracking-wide leading-none text-5xl sm:text-6xl md:text-7xl mb-6">
                Viste el <span class="text-brand-green">arte</span><br>de la calle
            </h1>
            <a href="tienda.html" class="inline-block bg-brand-green text-brand-bg font-bold uppercase tracking-wide px-9 py-4 rounded-lg hover:-translate-y-0.5 transition">Comprar ahora</a>
        </div>
    </section>

    <!-- ===== NUEVOS DROPS (carrusel) ===== -->
    <section id="drops" class="max-w-7xl mx-auto px-4 py-16">
        <h2 class="text-center uppercase font-brand text-3xl tracking-wide mb-8">Nuevos Drops</h2>
        <div class="flex items-center gap-3">
            <button id="carruselPrev" class="shrink-0 w-11 h-11 rounded-full bg-brand-green text-brand-bg text-lg font-bold hover:opacity-80" aria-label="Anterior">&#10094;</button>
            <div id="carruselTrack" class="flex gap-4 overflow-x-auto scroll-smooth no-scrollbar py-2"></div>
            <button id="carruselNext" class="shrink-0 w-11 h-11 rounded-full bg-brand-green text-brand-bg text-lg font-bold hover:opacity-80" aria-label="Siguiente">&#10095;</button>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="border-t border-white/10 py-8 text-center text-white/60 text-sm">
        <p class="mb-1"><a href="mailto:contacto@benjislab.com" class="hover:text-brand-green">contacto@benjislab.com</a></p>
        <p>&copy; 2026 Benji's Lab. Urban &amp; Aerógrafo. Todos los derechos reservados.</p>
    </footer>

    <!-- ===== CARRITO (drawer, compartido) ===== -->
    <div id="cartDrawer" class="fixed inset-0 z-50 hidden">
        <div data-cart-close class="absolute inset-0 bg-black/60"></div>
        <aside id="cartPanel" class="absolute right-0 top-0 h-full w-80 max-w-[85vw] bg-brand-card flex flex-col shadow-2xl translate-x-full transition-transform duration-300">
            <div class="flex items-center justify-between p-4 border-b border-white/10">
                <h2 class="font-bold text-lg">Tu carrito</h2>
                <button data-cart-close class="text-2xl leading-none hover:text-brand-green" aria-label="Cerrar">&times;</button>
            </div>
            <ul id="carritoItems" class="flex-1 overflow-y-auto p-4 space-y-3"></ul>
            <div class="p-4 border-t border-white/10">
                <div class="flex justify-between mb-3">
                    <span class="font-bold">Total:</span>
                    <span id="carritoTotal" class="font-bold text-brand-green">$0</span>
                </div>
                <a href="pago.html" class="block text-center bg-brand-blue font-bold py-3 rounded-lg hover:opacity-90">Finalizar compra</a>
            </div>
        </aside>
    </div>

    <script src="js/config.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
