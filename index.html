<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benji's Lab - Tienda de Ropa</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* DEFINICIÓN DE COLORES EXACTOS DE TU MARCA */
        :root {
            --bg-main: #0F0F0F;
            --text-main: #F5F5F5;
            --card-bg: #2E2E2E;
            --btn-primary: #76FF03;
            --btn-secondary: #00AEEF;
            --badge-noti: #FF3C00;
            --border-purple: #9400D3;
            --border-yellow: #FFD700;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: Arial, sans-serif;
        }

        /* ESTILOS PERSONALIZADOS SOBRE BOOTSTRAP */
        .navbar {
            background-color: var(--bg-main);
            /* ELIMINAMOS EL border-bottom PARA QUE NO HAYA DIVISIÓN VISIBLE */
        }

        .navbar-brand {
            font-family: 'Impact', sans-serif;
            color: var(--text-main) !important;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .nav-link {
            color: var(--text-main) !important;
            font-weight: bold;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--btn-primary) !important;
        }

        /* Color de la burbuja de notificación usando Bootstrap positioning */
        .bg-noti {
            background-color: var(--badge-noti) !important;
            font-size: 10px;
        }

        /* HERO - Imagen que ocupa el 100% de la pantalla */
        .hero-image-placeholder {
            width: 100%;
            height: 80vh;
            background-color: #1a1a1a; 
            /* background-image: url('tu-imagen-aqui.jpg'); */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* TARJETAS DE PRODUCTO */
        .custom-card {
            background-color: var(--card-bg);
            border-width: 2px;
            border-style: solid;
            border-radius: 10px;
        }
        
        .border-purple { border-color: var(--border-purple) !important; }
        .border-yellow { border-color: var(--border-yellow) !important; }

        .product-placeholder {
            width: 100%;
            height: 250px;
            background-color: #444;
            border-radius: 8px;
        }

        /* Imagen de producto traída desde la API (foto sobre fondo blanco) */
        .product-img {
            width: 100%;
            height: 250px;
            background-color: #fff;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
        }

        .btn-custom-blue {
            background-color: var(--btn-secondary);
            color: var(--text-main);
            font-weight: bold;
            border: none;
        }

        .btn-custom-blue:hover {
            opacity: 0.8;
            color: var(--text-main);
        }

        footer {
            border-top: 1px solid #333;
        }

        /* CARRUSEL DE PRODUCTOS TOP */
        .carrusel-top {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .carrusel-track {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 10px 4px;
            scrollbar-width: none;
        }

        .carrusel-track::-webkit-scrollbar { display: none; }

        .carrusel-item {
            flex: 0 0 220px;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            border: 2px solid var(--border-purple);
        }

        .carrusel-item .carrusel-img {
            width: 100%;
            height: 180px;
            background-color: #fff;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .carrusel-btn {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background-color: var(--btn-primary);
            color: var(--bg-main);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .carrusel-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg py-3 sticky-top">
        <div class="container-fluid px-4">
            
            <a class="navbar-brand" href="index.html">BENJI'S LAB</a>
            
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center gap-3">
                    <li class="nav-item"><a class="nav-link" href="#inicio">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link" href="#tienda">TIENDA</a></li>
                    <li class="nav-item"><a class="nav-link" href="#drops">NUEVOS DROPS</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">CONTACTO</a></li>
                    
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="#carrito" role="button" data-bs-toggle="offcanvas" data-bs-target="#carritoPanel">
                            <i class="fas fa-shopping-cart" style="font-size: 18px;"></i>
                            <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-noti">
                                0
                            </span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#buscar">
                            <i class="fas fa-search" style="font-size: 18px; color: var(--btn-primary);"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="container-fluid p-0">
        <div class="hero-image-placeholder"></div>
    </header>

    <main class="container py-5 my-4">
        <h2 class="text-center text-uppercase mb-5">Los Destacados de la Semana</h2>
        
        <!-- Las tarjetas se cargan dinámicamente desde la FakeStore API (js/productos.js) -->
        <div class="row g-4" id="gridDestacados">
            <p class="text-center text-secondary">Cargando productos...</p>
        </div>
    </main>

    <section class="container py-5" id="drops">
        <h2 class="text-center text-uppercase mb-4">Productos Top</h2>
        <div class="carrusel-top">
            <button class="carrusel-btn" id="carruselPrev" aria-label="Anterior">&#10094;</button>
            <div class="carrusel-track" id="carruselTrack"></div>
            <button class="carrusel-btn" id="carruselNext" aria-label="Siguiente">&#10095;</button>
        </div>
    </section>

    <footer class="py-4 mt-5 text-center">
        <p class="mb-0">&copy; 2026 Benji's Lab. Urban & Aerógrafo. Todos los derechos reservados.</p>
    </footer>

    <!-- Carrito de compras (panel lateral) -->
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="carritoPanel" aria-labelledby="carritoTitulo">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="carritoTitulo">Tu carrito</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-unstyled" id="carritoItems"></ul>
            <hr>
            <div class="d-flex justify-content-between mb-3">
                <strong>Total:</strong>
                <strong id="carritoTotal">$0</strong>
            </div>
            <a href="#comprar" class="btn btn-custom-blue w-100">Finalizar compra</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/carrusel.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
