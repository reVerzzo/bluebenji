<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Benji's Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tw-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-bg text-brand-text font-sans">

    <!-- ===== NAVBAR (compartido) ===== -->
    <header class="sticky top-0 z-40 bg-brand-bg/95 backdrop-blur border-b border-white/5">
        <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="../index.html" class="font-brand text-2xl tracking-wide shrink-0">BENJI'S LAB</a>
            <div id="navMenu" class="hidden md:flex md:items-center gap-6 absolute md:static top-full left-0 right-0 bg-brand-bg md:bg-transparent border-b border-white/10 md:border-0 px-4 md:px-0 py-3 md:py-0 flex-col md:flex-row">
                <a href="../index.html" class="font-bold text-sm hover:text-brand-green">INICIO</a>
                <a href="tienda.html" class="font-bold text-sm hover:text-brand-green">TIENDA</a>
                <a href="../index.html#drops" class="font-bold text-sm hover:text-brand-green">NUEVOS DROPS</a>
            </div>
            <div class="flex items-center gap-4 shrink-0">
                <a href="tienda.html" class="hover:opacity-80" aria-label="Buscar"><i class="fas fa-search text-brand-green"></i></a>
                <button data-cart-open class="relative hover:opacity-80" aria-label="Carrito">
                    <i class="fas fa-shopping-cart text-lg"></i>
                    <span id="cartCount" class="hidden absolute -top-2 -right-2 bg-brand-noti text-white text-[10px] font-bold rounded-full px-1.5 py-0.5">0</span>
                </button>
                <button id="navToggle" class="md:hidden text-xl" aria-label="Menú"><i class="fas fa-bars"></i></button>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <a href="tienda.html" class="text-sm text-white/60 hover:text-brand-green">&larr; Volver a la tienda</a>

        <div class="grid lg:grid-cols-2 gap-10 mt-4">

            <!-- Columna: imagen principal y miniaturas -->
            <div>
                <div id="imagenPrincipal" class="w-full h-[460px] rounded-xl border-2 border-brand-purple bg-white bg-contain bg-center bg-no-repeat"></div>
                <div id="miniaturas" class="flex gap-3 mt-4"></div>
            </div>

            <!-- Columna: información de venta (se rellena desde la API) -->
            <div>
                <p id="prodCategoria" class="uppercase text-sm text-white/50 mb-1">Cargando&hellip;</p>
                <h1 id="prodTitulo" class="text-3xl font-bold mb-3">Cargando producto&hellip;</h1>
                <p id="prodPrecio" class="text-brand-green text-3xl font-bold mb-4"></p>
                <p id="prodDescripcion" class="text-white/80 mb-4 leading-relaxed"></p>


                <!-- Tallas -->
                <p class="font-bold mb-2">Talla</p>
                <div id="tallas" class="flex gap-2.5 mb-6">
                    <button class="talla-btn w-12 h-12 rounded-lg border-2 border-white/30 font-bold hover:border-brand-green" data-talla="S">S</button>
                    <button class="talla-btn w-12 h-12 rounded-lg border-2 border-white/30 font-bold hover:border-brand-green" data-talla="M">M</button>
                    <button class="talla-btn w-12 h-12 rounded-lg border-2 border-white/30 font-bold hover:border-brand-green" data-talla="L">L</button>
                    <button class="talla-btn w-12 h-12 rounded-lg border-2 border-white/30 font-bold hover:border-brand-green" data-talla="XL">XL</button>
                </div>

                <!--agregar -->
                <div class="flex gap-3 items-stretch">
                    
                    <button id="btnAgregar" class="flex-1 bg-brand-blue text-brand-text font-bold uppercase py-3.5 rounded-lg hover:opacity-90">
                        Agregar al carrito
                    </button>
                </div>
                <a id="btnComprarYa" href="pago.html" class="block text-center mt-3 bg-brand-green text-brand-bg font-bold uppercase py-3.5 rounded-lg hover:opacity-90">
                    Comprar ahora
                </a>
                <p id="avisoTalla" class="text-sm mt-3"></p>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/10 py-8 text-center text-white/60 text-sm mt-10">
        <p class="mb-1"><a href="mailto:contacto@benjislab.com" class="hover:text-brand-green">contacto@benjislab.com</a></p>
        <p>&copy; 2026 Benji's Lab. Urban &amp; Aerógrafo. Todos los derechos reservados.</p>
    </footer>

    <!-- ===== CARRITO (drawer, compartido) ===== -->
    <div id="cartDrawer" class="fixed inset-0 z-50 hidden">
        <div data-cart-close class="absolute inset-0 bg-black/60"></div>
        <aside id="cartPanel" class="absolute right-0 top-0 h-full w-80 max-w-[85vw] bg-brand-card flex flex-col shadow-2xl translate-x-full transition-transform duration-300">
            <div class="flex items-center justify-between p-4 border-b border-white/10">
                <h2 class="font-bold text-lg">Tu carrito</h2>
                <button data-cart-close class="text-2xl leading-none hover:text-brand-green" aria-label="Cerrar">&times;</button>
            </div>
            <ul id="carritoItems" class="flex-1 overflow-y-auto p-4 space-y-3"></ul>
            <div class="p-4 border-t border-white/10">
                <div class="flex justify-between mb-3">
                    <span class="font-bold">Total:</span>
                    <span id="carritoTotal" class="font-bold text-brand-green">$0</span>
                </div>
                <a href="pago.html" class="block text-center bg-brand-blue font-bold py-3 rounded-lg hover:opacity-90">Finalizar compra</a>
            </div>
        </aside>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/cache.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/producto.js"></script>
</body>
</html>
